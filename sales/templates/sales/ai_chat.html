{% extends "base.html" %}  <!-- We'll create base.html next if you don't have one -->

{% block title %}TrailGear AI Analyst{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-header">
                    <h5>TrailGear AI Analyst</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">AI Model</label>
                        <select id="provider" class="form-select">
                            <option value="openai">GPT-4o-mini (Fast)</option>
                            <option value="anthropic">Claude 3.5 Sonnet</option>
                        </select>
                    </div>

                    <hr>
                    <h6>Suggested Questions</h6>
                    <div class="d-grid gap-2">
                        {% for item in suggested_queries %}
                        <button class="btn btn-outline-primary btn-sm suggestion-btn"
                                data-question="{{ item.question }}">{{ item.label }}</button>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="col-md-9">
            <div class="card">
                <div class="card-header d-flex justify-content-between">
                    <span><strong>Natural Language Sales Intelligence</strong></span>
                    <span class="text-muted">Ask anything about sales, customers, products...</span>
                </div>
                
                <div id="chat-container" class="card-body" style="height: 60vh; overflow-y: auto;">
                    <!-- Messages will be added here by JS -->
                </div>

                <div class="card-footer">
                    <form id="chat-form" class="input-group">
                        <input type="text" id="question-input" class="form-control" placeholder="Ask about sales..." autocomplete="off">
                        <button type="submit" class="btn btn-primary">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatContainer = document.getElementById('chat-container');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('question-input');
    const providerSelect = document.getElementById('provider');

    function addMessage(text, type, sql = null, result = null) {
        const div = document.createElement('div');
        div.className = `mb-3 ${type === 'user' ? 'text-end' : 'text-start'}`;
        
        let html = `<div class="d-inline-block p-3 rounded ${type === 'user' ? 'bg-primary text-white' : 'bg-light'}">`;
        html += `<strong>${type === 'user' ? 'You' : 'AI Analyst'}:</strong><br>${text}</div>`;

        if (sql) {
            html += `<details class="mt-2"><summary class="text-muted small">View SQL</summary><pre class="bg-white p-2 border rounded small">${sql}</pre></details>`;
        }

        if (result && result.columns) {
            html += `<div class="mt-3"><strong>Results:</strong>`;
            html += `<table class="table table-sm table-striped mt-2">`;
            html += `<thead><tr>`;
            result.columns.forEach(col => {
                html += `<th>${col}</th>`;
            });
            html += `</tr></thead><tbody>`;
            
            result.rows.forEach(row => {
                html += `<tr>`;
                row.forEach(cell => {
                    html += `<td>${cell}</td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody></table></div>`;
        }

        div.innerHTML = html;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Suggestion buttons
    document.querySelectorAll('.suggestion-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            input.value = btn.dataset.question;
            form.dispatchEvent(new Event('submit'));
        });
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const question = input.value.trim();
        if (!question) return;

        addMessage(question, 'user');
        input.value = '';

        const provider = providerSelect.value;

        try {
            const response = await fetch('/ai/query/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question, provider})
            });

            const data = await response.json();

            if (data.success) {
                if (data.type === 'insights') {
                    addMessage(data.insights, 'ai');
                } else {
                    let msg = "Here's the answer:";
                    if (data.tokens && data.tokens.total !== "N/A") {
                        msg += ` <small class="text-muted">(Tokens: ${data.tokens.total})</small>`;
                    }
                    addMessage(msg, 'ai', data.sql, data.result);
                }
            } else {
                let errorText = data.error || "Unknown error occurred";
                let html = `<span class="text-danger fw-bold">Error:</span> ${errorText}`;

                if (data.sql) {
                    html += `<details class="mt-2"><summary class="text-muted small cursor-pointer">Generated SQL</summary><pre class="bg-white p-2 border rounded small text-danger">${data.sql}</pre></details>`;
                }

                addMessage(html, 'ai');
            }
        } catch (err) {
            addMessage(`<span class="text-danger">Request failed: ${err.message}</span>`, 'ai');
        }
    });
});
</script>
{% endblock %}
